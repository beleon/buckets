<h1>🪣 buckets</h1>
<p>Tiny in-memory pastebin. Share a file with curl:</p>
<pre>curl --data-binary @notes.txt http://this-host/notes.txt</pre>
<p>The response is the bucket URL. Buckets expire after 24 hours.</p>
